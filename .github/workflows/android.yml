name: Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'src/**'
      - 'data/**'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Prepare fixed signing key (from Secrets)
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/shiyu.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/shiyu.keystore" >> "$GITHUB_ENV"
            echo "使用固定签名"
          else
            echo "::warning::未配置 SIGNING_KEYSTORE_BASE64,使用临时调试签名(无法覆盖安装)"
          fi
      - name: Build debug APK
        working-directory: android
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: english-beginner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to the "latest-apk" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk english-beginner.apk
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk english-beginner.apk --title "最新安卓安装包" --notes "调试版 APK,自动构建。提交 ${GITHUB_SHA::7}"
